pid /Users/allen/Programming/thinkmtb-order/logs/nginx.pid;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    error_log /Users/allen/Programming/thinkmtb-order/logs/nginx_error.log;
    access_log /Users/allen/Programming/thinkmtb-order/logs/nginx_access.log;

    server {
        listen 3001;
        server_name thinkmtb.moralesrodionoff.com;

        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
